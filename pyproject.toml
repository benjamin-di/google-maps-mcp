[project]
name = "google-maps-keyless-mcp"
version = "0.5.4"
description = "Read-only MCP server for Google Maps travel times, routes, places and map images, without an API key"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES"]
authors = [{ name = "benjamin-di" }]
requires-python = ">=3.12"
dependencies = [
    # FastMCP 4 (MCP SDK 2): stateless JSON over streamable HTTP, or stdio.
    "fastmcp==4.0.10",
    # The vendored gmaps-scraper (src/maps_mcp/vendor/gmaps) talks to Google with httpx.
    "httpx>=0.27,<0.29",
    # Places' opening hours are computed in the place's own time zone.
    "tzdata>=2025.2",
    # maps_static_map stitches Google's map tiles and draws routes and pins.
    "pillow>=12.0",
]

[project.urls]
Repository = "https://github.com/benjamin-di/google-maps-mcp"
Issues = "https://github.com/benjamin-di/google-maps-mcp/issues"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.14"]

[tool.uv]
# Security floors for transitive dependencies.
constraint-dependencies = [
    "starlette>=1.3.1,<2",
    "cryptography>=50.0.0",
    "joserfc>=1.6.8",
    "idna>=3.15",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.31",
    "authlib>=1.7.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maps_mcp"]

[project.scripts]
google-maps-keyless-mcp = "maps_mcp.server:main"
maps-mcp = "maps_mcp.server:main"  # the image's entrypoint and earlier docs

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"
# Vendored upstream code keeps upstream's style (refresh with scripts/vendor-gmaps.sh).
extend-exclude = ["src/maps_mcp/vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["SIM105"]

[tool.ruff.lint.isort]
known-first-party = ["maps_mcp"]
